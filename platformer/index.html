<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="../index.html">&larr; Игры</a>
      <h1>Canopy Runner</h1>
      <div class="hud">
        <span class="hud-item">🌰 <b id="hudAcorns">0</b>/<span id="hudTotal">0</span></span>
        <span class="hud-item">💀 <b id="hudDeaths">0</b></span>
        <span class="hud-item">⏱ <b id="hudTime">0.0</b>s</span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Лис проснулся в чаще</h2>
        <p id="overlayText">Собери жёлуди, обходи жуков, добеги до фонаря на краю рощи.</p>
        <button class="go-btn" id="overlayBtn">Бежать</button>
      </div>
    </div>

    <div class="touch-controls" id="touchControls">
      <div class="touch-side">
        <button id="btnLeft" aria-label="Влево">&#9664;</button>
        <button id="btnRight" aria-label="Вправо">&#9654;</button>
      </div>
      <button id="btnJump" class="jump" aria-label="Прыжок">Прыжок</button>
    </div>

    <p class="hint">A/D или стрелки — бег · Пробел/W/&uarr; — прыжок (держи для прыжка выше) · R — заново</p>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
